name: Build Kizuna launcher

on:
  push:
    branches:
      - '**'
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
    tags:
      - 'launcher-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (players auto-update to it)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Self-test
        run: npm run check
      - name: Microsoft app ID and server list
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          HUB_URL: ${{ vars.LAUNCHER_HUB_URL }}
          # Until the Microsoft app ID is set, builds keep the "test without signing in" option.
          TEST_MODE: ${{ secrets.MS_CLIENT_ID == '' && 'true' || 'false' }}
        run: node scripts/configure.js

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # Every build publishes to the GitHub release for its version. A new version in
          # package.json makes a new release, and installed launchers offer the update.
          npx electron-builder --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-${{ matrix.os }}
          path: |
            launcher/out/*.exe
            launcher/out/*.dmg
            launcher/out/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release (installed launchers offer the update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./launcher/package.json').version")
          id=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name==\"v$v\" and .draft) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH repos/${{ github.repository }}/releases/$id -f draft=false -f name="Kizuna Launcher $v" >/dev/null
            echo "published v$v"
          else
            echo "v$v already published (or nothing new)"
          fi
