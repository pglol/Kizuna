name: Build Kizuna launcher

on:
  push:
    branches:
      - '**'
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
    tags:
      - 'launcher-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (players auto-update to it)'
        type: boolean
        default: false

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows only for now; add macos-latest / ubuntu-latest back when needed.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Self-test
        run: npm run check
      - name: Microsoft app ID and server list
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          HUB_URL: ${{ vars.LAUNCHER_HUB_URL }}
          # Until the Microsoft app ID is set, builds keep the "test without signing in" option.
          TEST_MODE: ${{ secrets.MS_CLIENT_ID == '' && 'true' || 'false' }}
        run: node scripts/configure.js

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # Every build publishes to the GitHub release for its version. A new version in
          # package.json makes a new release, and installed launchers offer the update.
          npx electron-builder --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-${{ matrix.os }}
          path: |
            launcher/out/*.exe
            launcher/out/*.dmg
            launcher/out/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    # Publish even when one platform's build didn't finish (a Mac runner that never starts shouldn't
    # hold back the Windows update); the step checks the Windows installer is really there.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release (installed launchers offer the update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./launcher/package.json').version")
          # The build can leave more than one draft for a version; use the one with the Windows installer
          # (and its update file), and remove empty duplicates.
          ids=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name==\"v$v\" and .draft) | .id")
          id=""
          for i in $ids; do
            if [ -z "$id" ] && gh api repos/${{ github.repository }}/releases/$i --jq '.assets[].name' | grep -q '^latest.yml$'; then
              id=$i
            elif [ "$(gh api repos/${{ github.repository }}/releases/$i --jq '.assets | length')" = "0" ]; then
              gh api -X DELETE repos/${{ github.repository }}/releases/$i && echo "removed empty draft $i"
            fi
          done
          if [ -n "$ids" ] && [ -z "$id" ]; then
            echo "v$v has no Windows build yet; not publishing"
            exit 1
          fi
          if [ -n "$id" ]; then
            notes=$(node launcher/scripts/notes.js notes)
            name=$(node launcher/scripts/notes.js name)
            gh api -X PATCH repos/${{ github.repository }}/releases/$id -f draft=false -f name="$name" -f body="$notes" -f make_latest=true >/dev/null
            echo "published v$v"
          else
            echo "v$v already published (or nothing new)"
          fi
          # Leftover drafts of versions that are already out: remove them.
          for tag in $(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.draft|not) | .tag_name'); do
            for d in $(gh api repos/${{ github.repository }}/releases --paginate --jq ".[] | select(.draft and .tag_name==\"$tag\") | .id"); do
              gh api -X DELETE repos/${{ github.repository }}/releases/$d && echo "removed leftover draft of $tag"
            done
          done
          # Installed launchers only look at the release GitHub calls "latest". Keep that pointing at the
          # newest launcher release even after other uploads (like mod files).
          tag=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.draft|not) | select(.tag_name|startswith("v"))][0].id')
          [ -n "$tag" ] && gh api -X PATCH repos/${{ github.repository }}/releases/$tag -f make_latest=true >/dev/null && echo "latest -> $tag"
