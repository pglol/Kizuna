name: Build Warfront launcher

on:
  push:
    branches:
      - '**'
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
    tags:
      - 'launcher-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (players auto-update to it)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Self-test
        run: npm run check
      - name: Microsoft app ID and server list
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          HUB_URL: ${{ vars.LAUNCHER_HUB_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("config.json", "utf8"));
            if (process.env.CLIENT_ID) c.msClientId = process.env.CLIENT_ID;
            if (process.env.HUB_URL) c.hubUrl = process.env.HUB_URL;
            fs.writeFileSync("config.json", JSON.stringify(c, null, 2));
            console.log("client id set:", c.msClientId !== "SET_ME", "hub:", c.hubUrl);
          '
      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/launcher-v* || "${{ inputs.publish }}" == "true" ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: warfront-${{ matrix.os }}
          path: |
            launcher/out/*.exe
            launcher/out/*.dmg
            launcher/out/*.AppImage
          if-no-files-found: warn
