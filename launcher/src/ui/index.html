<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: file:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Kizuna</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="kanji">絆</span><b>KIZUNA</b><span class="testtag" id="testtag" hidden>TEST</span></div>
    <div class="drag"></div>
    <button class="tag" id="friends-btn" title="Friends"><span class="k">友</span><span id="friends-count">0</span></button>
    <button class="tag" id="account" title="Account"></button>
    <button class="wbtn" id="open-settings" title="Settings">設定</button>
    <div class="wctl">
      <button class="wbtn" data-win="min" title="Minimise"><svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg></button>
      <button class="wbtn" data-win="max" title="Maximise"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button class="wbtn close" data-win="close" title="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <nav class="shelf" id="rail" aria-label="Servers"></nav>

  <main class="page" id="hero">
    <section class="panel cover">
      <canvas id="scene"></canvas>
      <img id="art" alt="" hidden>
      <div class="tone"></div>
      <span class="vol" id="vol">VOL.1</span>
      <span class="stamp-status" id="chips"></span>
    </section>
    <section class="panel head">
      <span class="no" id="no"></span>
      <h1 id="title"></h1>
      <span class="live" id="online"></span>
    </section>
    <section class="news" id="news"></section>
  </main>

  <footer class="dock">
    <div class="ptext" id="ptext"></div>
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    <button class="plain" id="folder">game folder</button>
  </footer>

  <button class="hanko" id="play" aria-label="Play"><em>遊</em><span>PLAY</span></button>

  <aside class="drawer" id="friends" hidden>
    <div class="drawer-head"><h2><span class="k">友</span> Friends</h2><button class="wbtn" id="friends-close" title="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div>
    <form class="add" id="friend-form"><input class="field small" id="friend-input" placeholder="Minecraft name" maxlength="16" autocomplete="off" spellcheck="false"><button class="box red small">Add</button></form>
    <div class="flist" id="flist"></div>
  </aside>

  <div class="update" id="update" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <section class="overlay" id="signin" hidden>
    <div class="sheet signin">
      <div class="big">絆</div>
      <button class="box red" id="login">Sign in with Microsoft</button>
      <button class="box" id="test-go" hidden>Test without signing in</button>
      <p class="fine" id="signin-err"></p>
    </div>
  </section>

  <section class="overlay" id="settings" hidden>
    <div class="sheet">
      <h2>設定</h2>
      <label class="row">Memory <b id="ram-label"></b></label>
      <input type="range" id="ram" min="2" max="16" step="1">
      <label class="row toggle"><input type="checkbox" id="close-on-play"> Hide launcher while playing</label>
      <div class="row split"><span id="who"></span><button class="box small" id="logout">Sign out</button></div>
      <div class="row split"><span>Logs</span><button class="box small" id="logs">Open</button></div>
      <p class="fine" id="about"></p>
      <button class="box small" data-close>Done</button>
    </div>
  </section>

  <section class="overlay" id="code" hidden>
    <div class="sheet">
      <h2>Access code</h2>
      <input class="field" id="code-input" maxlength="40" placeholder="CODE" autocomplete="off" spellcheck="false">
      <p class="fine" id="code-err"></p>
      <div class="row split"><button class="box small" data-close>Cancel</button><button class="box red small" id="code-go">Unlock</button></div>
    </div>
  </section>

  <section class="overlay" id="crash" hidden>
    <div class="sheet wide">
      <h2>Game crashed</h2>
      <pre id="crash-log"></pre>
      <div class="row split"><button class="box small" id="crash-copy">Copy</button><button class="box small" data-close>Close</button></div>
    </div>
  </section>

  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
