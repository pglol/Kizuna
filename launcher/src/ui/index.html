<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Kizuna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" id="bg"><img id="bg-img" alt="" hidden><video id="bg-video" muted loop playsinline hidden></video></div>

  <nav class="rail">
    <div class="mark" id="mark" title="Kizuna"></div>
    <div class="servers" id="rail"></div>
    <div class="rail-end">
      <button class="rail-btn" id="open-settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <button class="avatar" id="account" title="Account"></button>
    </div>
  </nav>

  <div class="titlebar">
    <div class="drag"></div>
    <span class="testtag" id="testtag" hidden>Test build</span>
    <button class="wc" data-win="min" title="Minimise"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="wc" data-win="max" title="Maximise"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="wc close" data-win="close" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3"/></svg></button>
  </div>

  <main class="hero" id="hero">
    <img class="logo" id="logo" alt="" hidden>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="actions">
      <button class="play" id="play"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 4.5v15l12-7.5z"/></svg><span>Play</span></button>
      <div class="meta">
        <span class="online" id="online"></span>
        <button class="link" id="folder">Open game folder</button>
      </div>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="ptext" id="ptext"></div>
      <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    </div>
  </main>

  <section class="news" id="news"></section>

  <div class="toast" id="toast" hidden></div>
  <div class="update" id="update" hidden></div>

  <section class="overlay" id="signin" hidden>
    <div class="dialog">
      <h2>Sign in</h2>
      <p>Use the Microsoft account you play Minecraft with. You only do this once.</p>
      <button class="ms" id="login"><i></i><i></i><i></i><i></i><span>Sign in with Microsoft</span></button>
      <button class="secondary" id="test-go" hidden>Continue without signing in (test build)</button>
      <p class="fine" id="signin-err"></p>
    </div>
  </section>

  <section class="overlay" id="settings" hidden>
    <div class="dialog">
      <h2>Settings</h2>
      <label class="row">Memory <b id="ram-label"></b></label>
      <input type="range" id="ram" min="2" max="16" step="1">
      <label class="row check"><input type="checkbox" id="close-on-play"> Hide the launcher while the game is open</label>
      <div class="row split"><span id="who"></span><button class="secondary small" id="logout">Sign out</button></div>
      <div class="row split"><span>Launcher logs</span><button class="secondary small" id="logs">Open</button></div>
      <p class="fine" id="about"></p>
      <div class="row end"><button class="secondary small" data-close>Done</button></div>
    </div>
  </section>

  <section class="overlay" id="code" hidden>
    <div class="dialog">
      <h2>Access code</h2>
      <p>Enter the code you were given for a private server or a playtest.</p>
      <input class="field" id="code-input" maxlength="40" autocomplete="off" spellcheck="false">
      <p class="fine" id="code-err"></p>
      <div class="row end"><button class="secondary small" data-close>Cancel</button><button class="primary small" id="code-go">Unlock</button></div>
    </div>
  </section>

  <section class="overlay" id="crash" hidden>
    <div class="dialog wide">
      <h2>The game closed unexpectedly</h2>
      <p>Send this to an admin if it keeps happening.</p>
      <pre id="crash-log"></pre>
      <div class="row end"><button class="secondary small" id="crash-copy">Copy</button><button class="secondary small" data-close>Close</button></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
